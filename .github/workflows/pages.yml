name: Deploy to GitHub Pages

# Build from main and publish dist/ to the gh-pages branch.
#
# GitHub Pages must be enabled in the repo settings with "Deploy from a branch"
# and source = gh-pages (root). The Pages API is not available to this bot's
# token, so powering on the site source is the one manual step for the
# repository owner; after that every main push goes live automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Verify
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          publish_branch: gh-pages
